services:
  eureka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hufng-iot-eureka
    ports:
      - "8761:8761"

  # MQTT broker. EMQX supports shared subscriptions ($share/<group>/<topic>) out
  # of the box, which is what lets N hufng-ingest instances load-balance the
  # same topic like a Kafka consumer group. Anonymous access is dev-only —
  # production would add per-device ACL / mTLS.
  mqtt:
    image: emqx/emqx:latest
    container_name: hufng-iot-mqtt
    ports:
      - "1883:1883"   # MQTT
      - "18083:18083" # EMQX dashboard

  # Time-series store for telemetry -- append-only, columnar, TTL drops old
  # chunks instead of row-by-row deletes.
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hufng-iot-clickhouse
    ports:
      - "8123:8123" # HTTP/JDBC
      - "9000:9000" # native protocol
    volumes:
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: default

  mysql:
    image: mysql:8.0
    container_name: hufng-iot-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: hufng_iot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot@123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hufng-iot-redis
    ports:
      - "6379:6379"

  # Single-node KRaft (no Zookeeper) — enough to demo partitions/consumer
  # groups, not meant to be a durable/production topology.
  kafka:
    image: bitnami/kafka:3.7
    container_name: hufng-iot-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"

  hufng-ingest:
    build:
      context: ..
      dockerfile: hufng-ingest/Dockerfile
    container_name: hufng-iot-ingest
    ports:
      - "8084:8084"
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_BROKER_URL: tcp://mqtt:1883
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      mqtt:
        condition: service_started
      eureka:
        condition: service_started

  hufng-report:
    build:
      context: ..
      dockerfile: hufng-report/Dockerfile
    container_name: hufng-iot-report
    ports:
      - "8083:8083"
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_started
      kafka:
        condition: service_started
      eureka:
        condition: service_started

  hufng-notification:
    build:
      context: ..
      dockerfile: hufng-notification/Dockerfile
    container_name: hufng-iot-notification
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      MYSQL_HOST: mysql
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
