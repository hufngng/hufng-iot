[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Path_Key          log_file
    Docker_Mode       On
    Read_from_Head    On
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    DB                /fluent-bit/tail.db

# log_file is the full host path, e.g.
# /var/lib/docker/containers/<container_id>/<container_id>-json.log --
# extract just the id so Kibana can filter/group by container without
# a 64-char path.
[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/extract_container_id.lua
    call    extract_container_id

[OUTPUT]
    Name            es
    Match           docker.*
    Host            elasticsearch
    Port            9200
    Index           docker-logs
    Logstash_Format On
    Logstash_Prefix docker-logs
    Retry_Limit     False
    Suppress_Type_Name On
    Buffer_Size     False
    Generate_ID     On
