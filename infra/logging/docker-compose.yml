# Separate compose project (own network, own lifecycle) so it can be
# started/stopped independently of the app stack in ../docker-compose.yml
# without competing for the same `docker compose up` process. Run from
# this directory: `docker compose up -d`.
#
# Collects logs from every container on this host (not just hufng-iot's),
# by tailing Docker's own json-file log driver output on disk -- no
# per-service logging config needed anywhere else.
#
# EFK (not ELK): Fluent Bit is what runs as the log collector on
# Kubernetes too (DaemonSet, one pod per node, same tail-the-node's-log-
# files model), so this config carries over instead of being thrown away
# when this moves to k8s -- only the deployment manifest changes.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: hufng-logging-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1.5g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: hufng-logging-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=768"
    mem_limit: 1g
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: hufng-logging-fluent-bit
    mem_limit: 128m
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./extract_container_id.lua:/fluent-bit/etc/extract_container_id.lua:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fluent-bit-db:/fluent-bit
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
  fluent-bit-db:
